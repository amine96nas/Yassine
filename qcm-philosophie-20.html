<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار شامل - الأسطورة والفلسفة في اليونان</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #1e3a5f, #2c6e8f);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    width: 100%;
    max-width: 680px;
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  h1 { font-size: 1.35rem; color: #1e3a5f; margin: 0 0 4px; text-align: center; }
  .subtitle { text-align: center; color: #666; margin: 0 0 18px; font-size: 0.95rem; }
  .progress-wrap { background: #e6eef5; border-radius: 10px; height: 10px; overflow: hidden; margin-bottom: 8px; }
  .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #2c6e8f, #f0a500); transition: width 0.3s; }
  .counter { font-size: 0.85rem; color: #666; margin-bottom: 18px; text-align: center; }
  .question { font-size: 1.1rem; font-weight: bold; color: #222; margin-bottom: 14px; line-height: 1.7; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    border: 2px solid #d0dde8;
    border-radius: 10px;
    padding: 12px 16px;
    cursor: pointer;
    background: #f8fbfd;
    font-size: 1rem;
    text-align: right;
    transition: all 0.2s;
    font-family: inherit;
  }
  .option:hover:not(:disabled) { border-color: #2c6e8f; background: #eef6fb; }
  .option:disabled { cursor: default; }
  .option.correct { border-color: #2e9e5b; background: #e3f7ea; color: #1b6b3a; font-weight: bold; }
  .option.wrong { border-color: #d64545; background: #fde8e8; color: #9b2222; }
  .feedback { margin-top: 16px; padding: 12px; border-radius: 10px; min-height: 24px; font-weight: bold; text-align: center; }
  .feedback.good { background: #e3f7ea; color: #1b6b3a; }
  .feedback.bad { background: #fde8e8; color: #9b2222; }
  .explain { display: none; margin-top: 12px; padding: 14px; border-radius: 10px; background: #fff8e6; border: 1px solid #f0d78c; line-height: 1.8; font-size: 0.95rem; color: #333; }
  .explain.show { display: block; }
  .explain b { color: #1e3a5f; }
  .explain .detail-title { color: #8a5a00; font-weight: bold; margin-top: 8px; }
  .actions { display: flex; justify-content: flex-end; margin-top: 20px; }
  button.main {
    background: #2c6e8f; color: #fff; border: none; border-radius: 10px;
    padding: 10px 22px; font-size: 1rem; cursor: pointer; font-family: inherit;
  }
  button.main:disabled { background: #aab; cursor: not-allowed; }
  button.main:hover:not(:disabled) { background: #1e3a5f; }
  .result { text-align: center; }
  .result .score { font-size: 3rem; color: #1e3a5f; font-weight: bold; margin: 10px 0; }
  .result p { font-size: 1.1rem; color: #333; }
</style>
</head>
<body>
<div class="card">
  <h1>🧪 اختبار شامل</h1>
  <p class="subtitle">الأسطورة والفلسفة في اليونان - 20 سؤالا</p>

  <div class="progress-wrap"><div class="progress-bar" id="bar"></div></div>
  <div class="counter" id="counter"></div>

  <div id="quiz">
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="explain" id="explain"></div>
    <div class="actions">
      <button class="main" id="nextBtn" disabled>التالي ◀</button>
    </div>
  </div>

  <div id="result" class="result" style="display:none;">
    <div>🏆 انتهى الاختبار!</div>
    <div class="score" id="finalScore"></div>
    <p id="message"></p>
    <button class="main" id="restartBtn">إعادة الاختبار 🔄</button>
  </div>
</div>

<script>
  const questions = [
    {
      q: "1. ما معنى كلمة Mythos؟",
      options: ["الحجة العقلية", "الحكاية والكلام المروي", "القانون"],
      answer: 1,
      simple: "الميثوس هو الحكاية التي تُروى عن الآلهة والأبطال.",
      detail: "كانت الكلمة تعني في الأصل \"الكلام\" أو \"القول\"، ثم صارت تدل على الحكاية التي تفسر أصل العالم وأفعال الآلهة، وتقوم على السرد لا على البرهان."
    },
    {
      q: "2. ما معنى كلمة Logos؟",
      options: ["الكلام العقلي والحجة", "الحكاية الخيالية", "الطقوس الدينية"],
      answer: 0,
      simple: "اللوغوس هو الكلام الذي يُقنع بالدليل والعقل.",
      detail: "يدل اللوغوس على الخطاب المنظم القائم على التفكير والتعليل، وهو الأساس الذي بنت عليه الفلسفة طريقتها في البحث عن أسباب الأشياء."
    },
    {
      q: "3. ما هي Polis؟",
      options: ["قرية زراعية صغيرة", "معبد كبير للآلهة", "المدينة-الدولة"],
      answer: 2,
      simple: "البوليس هي المدينة اليونانية المستقلة التي تحكم نفسها.",
      detail: "كانت كل بوليس وحدة سياسية مستقلة لها قوانينها ومؤسساتها، وظهورها فتح المجال لمشاركة المواطنين في القرار."
    },
    {
      q: "4. تتكون كلمة démocratie من:",
      options: ["théos (الإله) و logos (الكلام)", "démos (الشعب) و kratein (الحكم)", "polis (المدينة) و agora (الساحة)"],
      answer: 1,
      simple: "الديمقراطية تعني \"حكم الشعب\".",
      detail: "كلمة démos تعني الشعب، وkratein تعني الحكم أو السلطة. فالديمقراطية تعني أن السلطة بيد المواطنين، لا بيد ملك أو طاغية."
    },
    {
      q: "5. أين كان المواطنون اليونانيون يتناقشون في الشأن العام؟",
      options: ["في الأغورا", "في المعبد", "في القصر الملكي"],
      answer: 0,
      simple: "الأغورا هي الساحة العامة في المدينة.",
      detail: "كانت الأغورا مكانا للتجارة والاجتماعات والمحاكمات والنقاش السياسي، وهي المكان الذي يتعلم فيه المواطن الكلام والإقناع."
    },
    {
      q: "6. حسب النص، ما الحق الذي كان يتمتع به كل مواطن في الشأن العام؟",
      options: ["حق الحكم بالقوة", "حق التعبير عن رأيه والمشاركة بصوته", "حق امتلاك الأرض وحدها"],
      answer: 1,
      simple: "كان كل مواطن يستطيع أن يعبّر عن رأيه ويشارك في القرار.",
      detail: "يذكر النص أن كل مواطن كان له الحق في التعبير عن آرائه في قضايا الشأن العام، والمشاركة بصوته في الأغورا (الساحة العامة)، وهذا ما جعل النقاش العلني ممكنا."
    },
    {
      q: "7. حسب النص، ماذا كانت تعني الديمقراطية عند اليونان القدماء؟",
      options: ["ممارسة سياسية مباشرة تعارض حكم الطغاة", "حكم الملك الوراثي", "حكم الكهنة للمدينة"],
      answer: 0,
      simple: "الديمقراطية كانت مشاركة مباشرة للمواطنين، ضد الطغيان.",
      detail: "يوضح النص أن الديمقراطية كانت تعني ممارسة سياسية مباشرة تتعارض مع نظام الطاغية ونظام الفرد المطلق، وتتعارض أيضا مع نظام الأوليغارشية الذي يحكمه أصحاب النسب."
    },
    {
      q: "8. حسب جان بيار فرنان، كيف كان الانتقال من الأسطورة إلى الفلسفة؟",
      options: ["قفزة مفاجئة وكاملة", "عملية تدريجية بطيئة", "تراجع وعودة إلى الخرافات"],
      answer: 1,
      simple: "لم تختف الأسطورة فجأة، بل تغيرت شيئا فشيئا.",
      detail: "يرى فرنان أن الفكر اليوناني انتقل من تفسير العالم بالحكاية إلى تفسيره بالعقل عبر مراحل متدرجة، ولم يكن هذا التحول قطيعة فورية."
    },
    {
      q: "9. ما الذي يميز الفلسفة عن الأسطورة من حيث المصدر؟",
      options: ["الوحي الإلهي", "الخيال الشعبي", "العقل والبرهان"],
      answer: 2,
      simple: "الأسطورة تُقبل بالإيمان، والفلسفة تُقبل بالحجة.",
      detail: "الفلسفة تقدم أفكارها بأسباب يمكن لأي إنسان فحصها ونقدها، بينما تعتمد الأسطورة على ما يُروى ويُتوارث."
    },
    {
      q: "10. حسب النص، متى تُتخذ القرارات المتعلقة بالمصلحة العامة؟",
      options: ["يتخذها الملك وحده", "بعد نقاش علني", "بالقرعة دون نقاش"],
      answer: 1,
      simple: "القرار الذي يهم الجميع يجب أن يُناقش أمام الجميع.",
      detail: "اعتبر النص أن المدينة الجديدة لا تقبل القرارات العامة إلا بعد نقاش علني مفتوح، وهذا أساس الفكر النقدي."
    },
    {
      q: "11. ما أهم ما يميز الأسطورة عند اليونان؟",
      options: ["السرد والحكاية", "البرهان والتجربة", "القوانين المكتوبة"],
      answer: 0,
      simple: "الأسطورة قصة تُروى.",
      detail: "كانت الأسطورة تعتمد على السرد الذي يحكي أصل الكون والآلهة والأبطال، ولا تطلب من المستمع أن يبرهن على صحتها."
    },
    {
      q: "12. حسب النص، متى توجد \"العقلانية الفلسفية\"؟",
      options: ["عندما تخضع كل القضايا للنقاش المفتوح والعلني", "عندما يُفرض الإيمان بالوحي", "عندما يُمنع الكلام في الشأن العام"],
      answer: 0,
      simple: "لا يوجد تفكير فلسفي حر إلا إذا كان كل شيء قابلا للنقاش.",
      detail: "يؤكد النص أن العقلانية الفلسفية لا تتحقق إلا إذا قبل المجتمع أن تكون كل القضايا محل نقاش علني، ولا يبقى رأي مفروض لا يُناقش."
    },
    {
      q: "13. أي عامل ليس شرطا لنشأة الفلسفة حسب النص؟",
      options: ["النظام السياسي الجديد", "الكتابة والنشر", "الحكم الاستبدادي المطلق"],
      answer: 2,
      simple: "الاستبداد يمنع التفكير الحر، فلا يمكن أن يكون سببا في نشوء الفلسفة.",
      detail: "الفلسفة نشأت في جو من الحرية السياسية والنقاش، والاستبداد يلغي هذا الجو، لذلك لا يُعد شرطا لنشأتها."
    },
    {
      q: "14. ما هي الأغورا؟",
      options: ["مجلس الشيوخ الملكي", "ساحة عمومية للنقاش والقرار", "معبد للآلهة"],
      answer: 1,
      simple: "الأغورا هي \"الساحة العامة\" التي يجتمع فيها الناس.",
      detail: "كانت الأغورا مكانا تجاريا وسياسيا واجتماعيا، وكانت تشبه الجمعية العامة التي تناقش شؤون المدينة وتتخذ فيها القرارات."
    },
    {
      q: "15. ما معنى كلمة Philosophia؟",
      options: ["حب الحكمة", "حب الذهب", "علم الآلهة"],
      answer: 0,
      simple: "الفيلسوف هو محب للحكمة، وليس الحكيم الكامل.",
      detail: "الكلمة مركبة من philein (أحب) وsophia (الحكمة). وتدل على موقف من يطلب المعرفة باستمرار، ولا يدعي امتلاكها كاملة."
    },
    {
      q: "16. من كان له حق الكلام في الأغورا الديمقراطية؟",
      options: ["الكهنة فقط", "كل المواطنين الأحرار", "الملك وحده"],
      answer: 1,
      simple: "الكلام في الشأن العام كان حقا للمواطنين.",
      detail: "لم يكن العبيد والنساء مواطنين بالمعنى الكامل، أما المواطنون الأحرار الذكور فكان لهم حق المشاركة والكلام، وهذا ما أتاح نشوء النقاش الفلسفي."
    },
    {
      q: "17. في أي قرن تقريبا ظهرت الفلسفة اليونانية الأولى؟",
      options: ["القرن الخامس قبل الميلاد", "القرن السادس قبل الميلاد", "القرن الأول الميلادي"],
      answer: 1,
      simple: "الفلسفة بدأت قبل نحو 2600 سنة.",
      detail: "يُعتبر طاليس الملطي (حوالي القرن السادس ق.م) من أوائل من يُنسب إليهم التفكير الفلسفي، فقد بحث في أصل الكون بالعقل لا بالحكاية."
    },
    {
      q: "18. ما الوظيفة الأساسية للأسطورة عند اليونانيين؟",
      options: ["تفسير العالم بالحكايات", "برهنة النظريات الرياضية", "إلغاء المعتقدات الدينية"],
      answer: 0,
      simple: "الأسطورة كانت الطريقة القديمة لفهم العالم.",
      detail: "كانت الأسطورة تجيب عن أسئلة مثل \"كيف بدأ الكون؟\" و\"لماذا تقع الكوارث؟\" بإحالتها إلى أفعال الآلهة، وهذا ما ستحاول الفلسفة تجاوزه بالعقل."
    },
    {
      q: "19. من هو جان بيار فرنان الذي ورد اسمه في الدرس؟",
      options: ["مؤرخ فرنسي متخصص في الفكر اليوناني", "فيلسوف يوناني قديم", "شاعر ملحمي"],
      answer: 0,
      simple: "فرنان عالم فرنسي درس الإغريق.",
      detail: "جان بيار فرنان (1914-2007) مؤرخ وباحث فرنسي، درس العلاقة بين الأسطورة والفكر والسياسة عند الإغريق، وهو صاحب النص الوارد في الدرس."
    },
    {
      q: "20. ما الذي أدى إلى نشأة الفلسفة في اليونان حسب الدرس؟",
      options: ["الاستبداد والحروب فقط", "نظام سياسي جديد وثقافة الكتابة والنقاش", "انتشار الأساطير والطقوس"],
      answer: 1,
      simple: "الفلسفة نتيجة تفاعل ثلاثة عناصر: السياسة والكتابة والنقاش.",
      detail: "ظهور المدينة-الدولة والديمقراطية وفّر الجو السياسي، والكتابة سمحت بتدوين الأفكار ونقدها، والنقاش العلني جعل الحجة والبرهان ضرورة، فنشأت الفلسفة."
    }
  ];

  let current = 0;
  let score = 0;
  let answered = false;

  const el = {
    q: document.getElementById("question"),
    opts: document.getElementById("options"),
    fb: document.getElementById("feedback"),
    explain: document.getElementById("explain"),
    next: document.getElementById("nextBtn"),
    bar: document.getElementById("bar"),
    counter: document.getElementById("counter"),
    quiz: document.getElementById("quiz"),
    result: document.getElementById("result"),
    finalScore: document.getElementById("finalScore"),
    message: document.getElementById("message"),
    restart: document.getElementById("restartBtn")
  };

  const letters = ["أ", "ب", "ج"];

  function render() {
    answered = false;
    const item = questions[current];
    el.q.textContent = item.q;
    el.opts.innerHTML = "";
    el.fb.textContent = "";
    el.fb.className = "feedback";
    el.explain.className = "explain";
    el.explain.innerHTML = "";
    el.next.disabled = true;
    el.next.textContent = current === questions.length - 1 ? "إنهاء ✔" : "التالي ◀";
    el.bar.style.width = (current / questions.length * 100) + "%";
    el.counter.textContent = `السؤال ${current + 1} من ${questions.length} | النقاط: ${score}`;

    item.options.forEach((text, i) => {
      const btn = document.createElement("button");
      btn.className = "option";
      btn.textContent = `${letters[i]}) ${text}`;
      btn.addEventListener("click", () => choose(i));
      el.opts.appendChild(btn);
    });
  }

  function choose(i) {
    if (answered) return;
    answered = true;
    const item = questions[current];
    const buttons = el.opts.querySelectorAll(".option");
    buttons.forEach(b => b.disabled = true);
    buttons[item.answer].classList.add("correct");

    if (i === item.answer) {
      score++;
      el.fb.textContent = "✅ إجابة صحيحة! أحسنت";
      el.fb.classList.add("good");
    } else {
      buttons[i].classList.add("wrong");
      el.fb.textContent = `❌ خطأ! الجواب الصحيح: ${letters[item.answer]}) ${item.options[item.answer]}`;
      el.fb.classList.add("bad");
    }

    el.explain.innerHTML =
      `<b>💡 شرح مبسط:</b> ${item.simple}` +
      `<div class="detail-title">📘 شرح مفصل:</div>${item.detail}`;
    el.explain.classList.add("show");
    el.counter.textContent = `السؤال ${current + 1} من ${questions.length} | النقاط: ${score}`;
    el.next.disabled = false;
  }

  el.next.addEventListener("click", () => {
    current++;
    if (current < questions.length) {
      render();
    } else {
      showResult();
    }
  });

  function showResult() {
    el.quiz.style.display = "none";
    el.result.style.display = "block";
    el.bar.style.width = "100%";
    el.finalScore.textContent = `${score} / ${questions.length}`;
    const ratio = score / questions.length;
    el.message.textContent =
      ratio >= 0.9 ? "ممتاز! أنت خبير في الفلسفة اليونانية 🏛️" :
      ratio >= 0.6 ? "عمل جيد! راجع الشروح المفصلة للأسئلة التي أخطأت فيها 📚" :
      "لا بأس، أعد الدرس وحاول مرة أخرى 💪";
  }

  el.restart.addEventListener("click", () => {
    current = 0;
    score = 0;
    el.quiz.style.display = "block";
    el.result.style.display = "none";
    render();
  });

  render();
</script>
</body>
</html>
